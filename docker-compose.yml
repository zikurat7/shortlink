services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortlink}
      POSTGRES_DB: shortlink
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlink -d shortlink"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://shortlink:${POSTGRES_PASSWORD:-shortlink}@db:5432/shortlink
    # Public URL embedded in short links; change it when deploying behind a real domain.
    command: ["--base-url", "http://localhost:8000"]
    restart: unless-stopped

volumes:
  pgdata:
